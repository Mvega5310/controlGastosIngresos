<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sin "viewport-fit=cover" el sistema recorta la ventana por su cuenta y la
      pagina empieza por debajo de la barra de estado. Con el, la pagina ocupa
      hasta el borde y es ella quien tiene que dejar el hueco: eso depende de
      que el navegador informe de los margenes seguros, y cuando no lo hace la
      hora y la cobertura se comen la cabecera. En una aplicacion de cuentas
      pesa mas que se lea siempre que llegar al borde de la pantalla.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e6b3a" />
    <meta name="description" content="FinControl: organiza tus finanzas personales." />
    <title>FinControl | Finanzas personales</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinControl" />
    <!-- "black-translucent" mete la pagina debajo de la barra de estado. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      El tema oscuro solo pintaba el fondo de la aplicación, no el de la página: el
      rebote al desplazar más allá del borde en iOS, y la franja de las áreas
      seguras en la app instalada, enseñaban un fondo claro alrededor de una app
      oscura. La clase se pone aquí, antes de que arranque React, para que
      tampoco haya un destello claro al abrir.
    -->
    <script>
      try {
        var guardado = localStorage.getItem('fc-theme')
        var oscuro = guardado ? guardado === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('tema-oscuro')
      } catch (e) {
        /* modo privado */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
